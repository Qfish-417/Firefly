services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: questlab
      POSTGRES_USER: questlab
      POSTGRES_PASSWORD: questlab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlab -d questlab"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/questlab-runtime.Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://questlab:questlab@postgres:5432/questlab
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  retrieval-api:
    build:
      context: ../..
      dockerfile: infra/docker/questlab-runtime.Dockerfile
    command: ["npm", "run", "retrieval:start"]
    environment:
      DATABASE_URL: postgresql://questlab:questlab@postgres:5432/questlab
      RETRIEVAL_HOST: 0.0.0.0
      RETRIEVAL_PORT: 3200
      RETRIEVAL_API_TOKEN: ${RETRIEVAL_API_TOKEN:-questlab-dev-retrieval-token}
      RETRIEVAL_IDENTITY_HMAC_SECRET: ${RETRIEVAL_IDENTITY_HMAC_SECRET:-questlab-dev-identity-secret-32-bytes-minimum}
      RETRIEVAL_LOGICAL_NAME: ${RETRIEVAL_LOGICAL_NAME:-memory.hybrid}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_SNAPSHOT: ${EMBEDDING_MODEL_SNAPSHOT:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    ports:
      - "53200:3200"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  index-worker:
    build:
      context: ../..
      dockerfile: infra/docker/questlab-runtime.Dockerfile
    command: ["npm", "run", "memory:index-build"]
    environment:
      DATABASE_URL: postgresql://questlab:questlab@postgres:5432/questlab
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  object-deletion-worker:
    build:
      context: ../..
      dockerfile: infra/docker/questlab-runtime.Dockerfile
    command: ["npm", "run", "memory:delete"]
    environment:
      DATABASE_URL: postgresql://questlab:questlab@postgres:5432/questlab
      MEMORY_DELETION_TARGET: object_store
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped

  external-deletion-worker:
    profiles: ["external-deletion"]
    build:
      context: ../..
      dockerfile: infra/docker/questlab-runtime.Dockerfile
    command: ["npm", "run", "memory:delete"]
    environment:
      DATABASE_URL: postgresql://questlab:questlab@postgres:5432/questlab
      MEMORY_DELETION_TARGET: ${MEMORY_DELETION_TARGET:-external_lexical}
      MEMORY_DELETION_ENDPOINT: ${MEMORY_DELETION_ENDPOINT:-}
      MEMORY_DELETION_PROVIDER_TOKEN: ${MEMORY_DELETION_PROVIDER_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
