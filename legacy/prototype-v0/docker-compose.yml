# FireFly 自进化 Agent 系统 - 单机 Docker Compose
# 11 个服务：8 基础设施 + 3 Agent
# 启动顺序：基础设施先起（nacos/postgres/redis/mq/milvus/es/gitea）→ 三个 agent
# 用法：docker-compose up -d
version: "3.8"

services:
  # ============ 基础设施 ============
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: firefly-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"   # gRPC 端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:15
    container_name: firefly-postgres
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: firefly-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.3
    container_name: firefly-mq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.1.3
    container_name: firefly-mq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "8080:8081"   # dashboard 占位避免与主力冲突
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"

  # Milvus 向量库（单机 etcd+minio 内嵌版）
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: firefly-milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: firefly-milvus
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
    ports:
      - "19530:19530"
      - "9091:9091"   # milvus metrics
    volumes:
      - milvus_data:/var/lib/milvus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2
    container_name: firefly-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  gitea:
    image: gitea/gitea:1.21
    container_name: firefly-gitea
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "3000:3000"   # web
      - "2222:22"     # ssh
    volumes:
      - gitea_data:/data

  # ============ 三个 Agent ============
  # 主力 Java（Spring Boot），对外 8080，gRPC 9090
  main-agent:
    build: ./main-agent
    container_name: firefly-main
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"   # HTTP 对外 API
      - "9090:9090"   # gRPC（被侦察/升级调）
    environment:
      NACOS_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      MILVUS_HOST: milvus
      ES_HOST: elasticsearch:9200

  # 侦察 Python（FastAPI），HTTP 8081，gRPC 9091
  scout-agent:
    build: ./scout-agent
    container_name: firefly-scout
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "9092:9092"   # gRPC EvaluateService
    environment:
      NACOS_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      MILVUS_HOST: milvus
      ES_HOST: elasticsearch:9200
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876

  # 升级 Python（FastAPI），HTTP 8082，gRPC 9093
  upgrade-agent:
    build: ./upgrade-agent
    container_name: firefly-upgrade
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      gitea:
        condition: service_started
    ports:
      - "8082:8082"
      - "9093:9093"   # gRPC UpgradeService
    environment:
      NACOS_ADDR: nacos:8848
      POSTGRES_HOST: postgres
      GITEA_HOST: gitea:3000
      ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      MILVUS_HOST: milvus
      ES_HOST: elasticsearch:9200
    volumes:
      # 升级需要访问 gitea 仓库 worktree
      - gitea_data:/data/repos

volumes:
  pg_data:
  redis_data:
  etcd_data:
  milvus_data:
  es_data:
  gitea_data:
